services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Dedicated, non-default port so this doesn't clash with any other local postgres.
      - "5462:5432"
    volumes:
      - bookshop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookshop-postgres-data:
